# Cache policy by response type, resolved when the header is written.
#
# It has to be a map, not an `if` inside the location: `if` runs in the
# rewrite phase, before nginx knows what it is about to serve, so
# $sent_http_content_type is empty there and every page silently took the
# default. A map variable is evaluated lazily, at the point add_header uses
# it, by which time the type is known.
#
# conf.d/*.conf is included inside `http`, so this belongs here, above the
# server block.
map $sent_http_content_type $preen_cache_control {
    # Everything under public/ — images, fonts, stylesheets. Content-hashed
    # assets get their own far-future rule in the /_litro/ location below.
    default        "public, max-age=604800";
    # HTML must never be cached. A page is requested as /docs/pipes, so a
    # `\.html$` regex location would never match it, and without this a reader
    # could hold old HTML pointing at a bundle we told them to keep for a
    # year. CI curls with an empty cache and would stay green throughout.
    ~*^text/html   "no-cache, no-store, must-revalidate";
}

server {
    listen 80;
    # Also accept IPv6. Without this, anything resolving "localhost" to ::1
    # inside the container -- a healthcheck, a sidecar -- gets connection
    # refused even though the site is serving fine over IPv4.
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep redirects relative so a non-80 port or a proxy prefix survives.
    absolute_redirect off;

    # Clean URLs. Serve the directory's index.html directly rather than
    # redirecting to the trailing-slash form — no extra round trip, and no
    # chance of nginx rewriting the host/port on the way.
    location / {
        try_files $uri $uri.html $uri/index.html =404;

        # See the map above for what this resolves to. Deliberately without
        # `always`, so an error response carries no Cache-Control at all — a
        # cached 404 outlives whatever caused it.
        add_header Cache-Control $preen_cache_control;
    }

    # 1-year immutable caching for the client bundle (a deploy always rewrites it)
    location /_litro/ {
        # Deliberately no `expires` directive: it emits a Cache-Control of its
        # own alongside this one, and a proxy that reads only the first header
        # silently drops `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    # Any shared cache in front of this (Traefik, Cloudflare) keys on the URL
    # alone without it, and can hand gzipped bytes to a client that never sent
    # Accept-Encoding.
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/xml;
}
