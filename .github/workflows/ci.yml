name: ci
on: [push, pull_request]

# Stated rather than inherited. With no block here every job gets whatever the
# repository default happens to be -- read-write in a repo created before the
# default changed, and changeable from a setting nothing in this file can see.
# On a push to main that token is live in the same run as the job holding
# COOLIFY_API_TOKEN, so it is worth saying out loud what it may do.
#
# `contents: read` is the whole of it, and no job overrides it, because none
# of them writes anything back to GitHub: the four that check out only read,
# `deploy` reaches Coolify over a webhook with its own separate secret, and
# `verify-prod` only makes HTTP requests to the live site.
#
# This narrows more than it looks. The repository default is already `read`,
# so the block reads like a restatement -- but naming ANY scope here sets
# every unnamed one to `none`, while the default `read` grants read on all of
# them. The runner prints the result, and it changed: before this block the
# `GITHUB_TOKEN Permissions` group listed Contents, Metadata and **Packages**;
# now it lists Contents and Metadata. Nothing wants Packages -- site/Dockerfile
# builds from node:22-slim and nginx:alpine on Docker Hub, and there is no
# docker/login-action and no ghcr reference anywhere in this file.
#
# The upload-artifact step in `site` is the one that looks like an exception
# and is not -- see the note on it below.
permissions:
  contents: read

jobs:
  # preen is a bash script, so the cheapest useful check is that it parses.
  # `bash -n` catches an unclosed quote or a broken heredoc, which is most of
  # what actually goes wrong in a file this shape.
  # Two runners, because the two halves of what preen stands on differ. Linux
  # gives it bash 5 and GNU coreutils; macOS gives it **bash 3.2.57** and the
  # BSD versions of sort, tr, find and awk. 3.2 is the last GPLv2 series
  # (2006); Apple stopped there because 4.0 went GPLv3, and 3.2.57 is its final
  # patchlevel, from the 2014 Shellshock round.
  #
  # preen is a bash script that builds NUL-delimited path lists with
  # `read -d ""`, `${arr[@]+"${arr[@]}"}` under `set -u`, `sort -z`,
  # `find -print0` and an awk that decodes octal escapes. Every one of those is
  # somewhere the two platforms can disagree, and macOS is where preen is most
  # often run, so a green Linux job on its own says less than it looks.
  shell:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      # Not fail-fast: when a change breaks one platform, the interesting
      # question is immediately whether it broke the other, and cancelling the
      # sibling job throws that answer away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # FIRST, and it has to stay first. The two dependency steps further down
      # are `if: runner.os == 'Linux'` and `if: runner.os == 'macOS'`, with no
      # `else`: add windows-latest and both are skipped, nothing installs, and
      # `Test suite` dies inside the suite on a missing fzf. This names the OS
      # that has no dependency step instead.
      #
      # Position is the whole of whether that works. Every other `run:` step
      # in this job has a bash body -- `command -v`, a `for` loop, `bash -n`
      # -- and `run:` on a Windows runner is pwsh, because nothing here sets
      # `shell:`. So any of them placed above this one fails first, with a
      # PowerShell parser error inside a bash loop, and Actions then skips
      # every later step including this one. The reader would get exactly the
      # confusing failure this exists to replace, and never see the message.
      # Even `actions/checkout` is below it: this step needs no checkout, only
      # `runner.os`, so there is nothing to put above it.
      #
      # `echo` and `exit 1` are the whole body deliberately -- both are valid
      # in pwsh as well as bash, so the step behaves on a runner whose default
      # shell this workflow has never pinned. `${{ runner.os }}` is likewise a
      # template expansion rather than `$RUNNER_OS`: Actions substitutes it
      # before any shell sees it, so it reads correctly under both.
      #
      # Skipped on both real runners today -- that is the point, and it is the
      # one cost: one skipped step per leg.
      - name: Unsupported runner OS
        if: runner.os != 'Linux' && runner.os != 'macOS'
        run: |
          echo "::error::${{ runner.os }} has no dependency step in this job. Add one, or drop the OS from the matrix."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Pin the interpreter before any step reads it. `bin/preen`, the
      # installer and every test file are `#!/usr/bin/env bash`, so the version
      # they run under is whichever bash PATH resolves -- and if this image
      # ever ships a Homebrew bash 5 ahead of the system one, this repo would
      # quietly lose the only 3.2 coverage it has. GITHUB_PATH prepends for
      # every LATER step, so the diagnostic below, the syntax check, --help,
      # the installer and the suite all agree by construction.
      #
      # /bin holds core BSD tools only -- no fzf, delta, git, python3, sort,
      # awk or find -- so nothing else is shadowed. The listing is printed
      # below rather than asserted, because that is evidence and this is a pin.
      - name: Pin macOS to the system bash
        if: runner.os == 'macOS'
        run: echo "/bin" >> "$GITHUB_PATH"
      # What actually ran, in the log, for both runners -- the first thing to
      # read if this job ever fails on one OS only.
      - name: Which bash and which userland
        run: |
          echo "bash:  $(command -v bash)"
          bash --version | head -n 1
          echo "sort:  $(command -v sort)"
          echo "awk:   $(command -v awk)"
          echo "find:  $(command -v find)"
          # PATH last, and in full: it is the only value the pin above changes.
          # `command -v bash` cannot show that pin working, because /bin/bash
          # is the only bash on the image today with or without it.
          if [ "$RUNNER_OS" = macOS ]; then echo "/bin:  $(ls /bin | tr '\n' ' ')"; fi
          echo "PATH:  $PATH"
      # `|| exit 1`, not `&& echo`. Under `set -e` the left side of an `&&` is
      # exempt from the abort, and a `for` loop exits with the status of its
      # LAST iteration -- so the old form printed the syntax error and passed,
      # and only the final line of the step was ever enforced.
      - name: Parse the shell
        run: |
          rc=0
          for f in bin/preen install.sh site/sync-assets.sh; do
            if bash -n "$f"; then echo "ok  $f"; else rc=1; fi
          done
          if sh -n scripts/verify-site.sh; then
            echo "ok  scripts/verify-site.sh"
          else
            rc=1
          fi
          # Every file is checked before the step gives up, so one run names
          # all of them rather than only the first.
          exit "$rc"
      # `|| exit 1` here too. These two are safe as `cmd && echo` only because
      # each step body is a single command, so the `&&` list is also the last
      # one and its status becomes the step's -- the same accident that made
      # the loop above look fine. A second line in either would quietly bring
      # the bug back.
      - name: Help output runs
        run: |
          bin/preen --help > /dev/null || exit 1
          echo "ok  preen --help"
      - name: Installer dry run changes nothing
        run: |
          ./install.sh --dry-run > /dev/null || exit 1
          echo "ok  install.sh --dry-run"
      # The third of the three, and until now the odd one out: site/sync-assets.sh
      # had the `bash -n` above and nothing else. No job ran it and the site
      # build does not call it either, so a tape renamed in demo/ or a typo in
      # an output path shipped green. --dry-run resolves every source path and
      # every destination directory and writes nothing, so it needs no webp
      # installed and costs this job no encode time.
      #
      # The exit status is not enough on its own, and this is the half that
      # matters. --dry-run checks that each destination's DIRECTORY exists; it
      # cannot check the filename, because any name inside public/ satisfies
      # it. So `public/preen.webp` mistyped as `public/preen.wepb` passes the
      # script, passes a real encode, writes bytes nothing reads, and leaves
      # the stale recording in place -- verbatim the failure #27 was filed
      # about. Nothing downstream notices either: the .webp files are
      # committed, so the build and Playwright both find the old one.
      #
      # Hence the list below. Every name in it is load-bearing -- the site
      # references them literally:
      #
      #   public/preen.webp        site/content/docs/getting-started.md:14
      #                            site/pages/index.ts:233
      #   public/preen-md.webp     site/content/docs/getting-started.md:31
      #   public/preen-pipes.webp  site/content/docs/pipes.md:10
      #   public/preen-pr.webp     site/content/docs/pull-requests.md:8
      #   public/logo.webp         site/pages/index.ts:167
      #                            site/src/components/starlight-header.ts:326
      #
      # It is written out HERE rather than read back from the script on
      # purpose. Asking sync-assets.sh what it intends to write and then
      # checking it wrote that would agree with itself whatever it said, typo
      # included. The list has to be one the script cannot edit. The cost is
      # that a genuinely new tape means editing two files; the error below
      # says so, and the .webp has to be committed for the site to serve it
      # anyway.
      #
      # This also catches the cruder ways the script stops working: gutted to
      # `exit 0`, or with an emptied GIFS/PNGS list, it prints nothing and the
      # comparison fails -- on BOTH runners, and naming the real reason.
      # `set -u` alone catches the empty list only on macOS bash 3.2, and only
      # as "unbound variable".
      #
      # LC_ALL=C on the sort because this repo runs BSD and GNU sort side by
      # side, and their default collation disagrees about punctuation --
      # `preen-pr` vs `preen.webp` is exactly the pair that would differ.
      - name: Asset sync writes the files the site reads
        run: |
          out="$RUNNER_TEMP/sync-assets-dry-run.txt"
          site/sync-assets.sh --dry-run > "$out" || exit 1
          # Echoed in full: these paths are the evidence the script ran, and
          # the first thing to read when a rename is what broke.
          cat "$out"
          expected=$(printf '%s\n' \
            public/logo.webp \
            public/preen-md.webp \
            public/preen-pipes.webp \
            public/preen-pr.webp \
            public/preen.webp)
          actual=$(awk '$1 == "would" && $2 == "write" { print $3 }' "$out" | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::site/sync-assets.sh no longer writes the files the site reads. Fix the script, or update this list and commit the new .webp."
            printf 'expected:\n%s\ngot:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          echo "ok  site/sync-assets.sh --dry-run (5 destinations, all as expected)"
      # The behaviour suite. Parsing the shell says nothing about what the tool
      # does; this drives preen against throwaway repositories and checks the
      # file lists, the previews, the stdin sniff, and that the review modes
      # write nothing.
      - name: Install the tools the suite drives (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-delta fzf
      - name: Install the tools the suite drives (macOS)
        if: runner.os == 'macOS'
        # No `brew update`: the runner image is already current, and updating
        # costs minutes for nothing. git-delta is the formula; the binary it
        # installs is `delta`, which is the name the tests look for.
        run: brew install git-delta fzf
      - name: Test suite
        run: |
          echo "running the suite under: $(command -v bash) $(bash --version | head -n 1)"
          tests/run.sh

  # The build is the real check on the site: it fails on a duplicate slug, a
  # missing frontmatter title or a broken component, and it prerenders every
  # route so a page that would 404 in production fails here instead.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4.3.0
        with:
          # `defaults.run.working-directory` above applies to `run:` steps
          # only, not to an action's inputs — without this the action looks for
          # packageManager in a package.json at the repo root, which does not
          # exist, and fails with "No pnpm version is specified".
          package_json_file: site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          # Matches site/Dockerfile, so CI and the deployed image agree.
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # `pnpm build` alone is not enough, and neither is the HTTP probe. A
      # broken client bundle still answers 200 with the prerendered markup in
      # the document; it throws in the browser, the element never upgrades, and
      # the page paints nothing. Only a real browser sees that.
      #
      # Two runs, not one, and the order matters. `dev` drives `litro dev`,
      # Vite serving modules from source. `preview` drives `litro preview`, the
      # prerendered dist/static that nginx ships -- the artifact production
      # actually serves, which nothing browser-level opened before this.
      #
      # What only `preview` can catch is client code that differs between the
      # two builds: anything behind `import.meta.env.PROD`, anything the
      # minifier or tree-shaker rewrites. A `throw` inside `if
      # (import.meta.env.PROD)` passes `dev` 5/5 and fails `preview` 3/5.
      #
      # They cannot share a run: `litro dev` deletes dist/ on startup, which is
      # the directory `litro preview` serves, and Playwright starts the entries
      # of a `webServer` array concurrently. So `dev` first, then `preview`,
      # which rebuilds dist/ as the first half of its own server command.
      - name: End-to-end (dev server)
        run: pnpm test:e2e:dev
      - name: End-to-end (built output)
        # `!cancelled()`, so a dev-server failure does not skip this. Without
        # it a branch that breaks both renderers needs two CI round trips to
        # learn that, and the built output -- the thing that actually ships --
        # is the half you would not hear about.
        if: '!cancelled()'
        run: pnpm test:e2e:preview
      - name: Playwright report
        # This job gates smoke-image, which gates deploy, so a failure here
        # blocks a release -- and without this the trace and HTML report that
        # explain why are thrown away with the runner. Each target reports into
        # its own subdirectory, so the passing run does not overwrite the
        # failing one.
        #
        # No `actions: write` for this, and none needed: upload-artifact v4
        # talks to the artifact service with ACTIONS_RUNTIME_TOKEN, which the
        # runner mints per job and which the `permissions:` block at the top
        # does not govern. The same is true of `cache: pnpm` above and of the
        # type=gha build cache in smoke-image. Checked by running this step on
        # a real run under `contents: read` rather than reasoned about.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
      # No rebuild step here. The `preview` run above ends with a fresh dist/,
      # because building it is the first half of that target's server command
      # -- and the route check below reads dist/static, so it fails loudly if
      # that ever stops being true.
      - name: Every documented route was prerendered
        run: |
          for p in "" docs/getting-started docs/browsing docs/pipes \
                   docs/pull-requests docs/worktrees docs/git-integration \
                   docs/theming; do
            f="dist/static/${p:+$p/}index.html"
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok  /$p"
          done

  # Build the exact image Coolify deploys, run it, and probe it the same way
  # verify-prod probes production. Catches "the site builds" vs "the container
  # actually serves it" — two different claims.
  smoke-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [site]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./site
          load: true
          tags: preen-docs:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --rm -p 8080:80 --name preen-docs-smoke preen-docs:ci
      - name: Probe container
        env:
          # Asserts the image really baked GIT_SHA into /version.json, so the
          # production probe below can rely on that signal.
          PREEN_EXPECT_COMMIT: ${{ github.sha }}
          PREEN_PROBE_RETRIES: '15'
          PREEN_PROBE_DELAY: '2'
        run: sh scripts/verify-site.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs preen-docs-smoke || true
      - name: Stop container
        if: always()
        run: docker stop preen-docs-smoke || true

  # Deploy only when a push to main actually changed the site. A change to
  # bin/preen or the installer cannot alter what preening.dev serves, so it
  # should not spend a build.
  #
  # This job FAILS if COOLIFY_WEBHOOK_URL, COOLIFY_API_TOKEN or PROD_BASE_URL
  # is missing. That is deliberate -- a silent skip would leave the site
  # permanently undeployed with CI green -- but it means all three have to
  # exist before the first site change lands on main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shell, site, smoke-image]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }
      - name: Did this push touch the site?
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare against what main pointed at BEFORE this push, not HEAD~1.
          # A push carries every commit since the last one — a merge, or three
          # commits at once — and HEAD~1 sees only the last of them. A push
          # whose final commit happens to miss site/ would then skip the deploy
          # and report green, with the site changes sitting undeployed.
          #
          # github.event.before is all-zeroes for a new branch, and points at a
          # discarded commit after a force-push. Both mean "cannot tell", and
          # the safe answer to that is to deploy.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no usable before-commit ($BEFORE) — deploying to be safe."
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site/ unchanged across this push — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "site/ changed across this push — deploying."
          fi
      - name: Trigger Coolify deploy
        if: steps.gate.outputs.changed == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # Hard failure, not a skip. This step only runs on a push to main
          # that changed site/, and the secrets are configured — so an unset
          # one means somebody renamed or removed it, and silently passing
          # would leave the site permanently undeployed while CI stayed green.
          missing=""
          [ -n "$COOLIFY_WEBHOOK_URL" ] || missing="$missing COOLIFY_WEBHOOK_URL"
          [ -n "$COOLIFY_API_TOKEN" ]   || missing="$missing COOLIFY_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::not set:$missing. The site cannot deploy."
            exit 1
          fi
          # No -L. Following a redirect re-sends the Authorization header to
          # whatever host it points at, which would hand the token to a third
          # party. The webhook URL is expected to answer directly.
          curl -fSs -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "$COOLIFY_WEBHOOK_URL"

  # Probe the live site after a deploy. The webhook only QUEUES a build, so
  # this must wait for the new commit to actually be serving —
  # PREEN_EXPECT_COMMIT makes the probe retry until /version.json reports this
  # exact SHA. Without it the probe passes against the previous container and a
  # failed deploy looks green.
  verify-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.changed == 'true'
    needs: [deploy]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Probe production
        env:
          PREEN_EXPECT_COMMIT: ${{ github.sha }}
          # Coolify builds the image before swapping the container, so allow a
          # cold, uncached build: 60 x 10s = 10 minutes.
          PREEN_PROBE_RETRIES: '60'
          PREEN_PROBE_DELAY: '10'
          # Through `env:`, like PREEN_EXPECT_COMMIT above, rather than
          # `${{ }}` inside the `run:` body. A template expansion there is
          # textual substitution performed before any shell starts, so a value
          # holding a quote or `$(...)` becomes part of the command rather
          # than an argument to it. This one is an admin-set repository
          # variable, so it was never the likely way in -- but it was the last
          # interpolation of a non-constant into a shell body in this file,
          # and the whole point of the block at the top is that the workflow
          # says what it may do.
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          # An `env:` value is always defined, empty when the variable is
          # unset, so the -z test still reads the "not configured" case.
          if [ -z "$PROD_BASE_URL" ]; then
            echo "::error::PROD_BASE_URL is not set, so the deploy cannot be verified."
            exit 1
          fi
          sh scripts/verify-site.sh "$PROD_BASE_URL"
