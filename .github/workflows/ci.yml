name: ci
on: [push, pull_request]

jobs:
  # preen is a bash script, so the cheapest useful check is that it parses.
  # `bash -n` catches an unclosed quote or a broken heredoc, which is most of
  # what actually goes wrong in a file this shape.
  # Two runners, because the two halves of what preen stands on differ. Linux
  # gives it bash 5 and GNU coreutils; macOS gives it **bash 3.2.57** and the
  # BSD versions of sort, tr, find and awk. 3.2 is the last GPLv2 series
  # (2006); Apple stopped there because 4.0 went GPLv3, and 3.2.57 is its final
  # patchlevel, from the 2014 Shellshock round. preen is a bash script that builds NUL-delimited path lists
  # with `read -d ""`, `${arr[@]+"${arr[@]}"}` under `set -u`, `sort -z`,
  # `find -print0` and an awk that decodes octal escapes. Every one of those is
  # somewhere the two platforms can disagree, and macOS is where preen is most
  # often run, so a green Linux job on its own says less than it looks.
  shell:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      # Not fail-fast: when a change breaks one platform, the interesting
      # question is immediately whether it broke the other, and cancelling the
      # sibling job throws that answer away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Pin the interpreter before any step reads it. `bin/preen`, the
      # installer and every test file are `#!/usr/bin/env bash`, so the version
      # they run under is whichever bash PATH resolves -- and if this image
      # ever ships a Homebrew bash 5 ahead of the system one, this repo would
      # quietly lose the only 3.2 coverage it has. GITHUB_PATH prepends for
      # every LATER step, so the diagnostic below, the syntax check, --help,
      # the installer and the suite all agree by construction.
      #
      # /bin holds core BSD tools only -- no fzf, delta, git, python3, sort,
      # awk or find -- so nothing else is shadowed. The listing is printed
      # below rather than asserted, because that is evidence and this is a pin.
      - name: Pin macOS to the system bash
        if: runner.os == 'macOS'
        run: echo "/bin" >> "$GITHUB_PATH"
      # What actually ran, in the log, for both runners -- the first thing to
      # read if this job ever fails on one OS only.
      - name: Which bash and which userland
        run: |
          echo "bash:  $(command -v bash)"
          bash --version | head -n 1
          echo "sort:  $(command -v sort)"
          echo "awk:   $(command -v awk)"
          echo "find:  $(command -v find)"
          if [ "$RUNNER_OS" = macOS ]; then echo "/bin:  $(ls /bin | tr '\n' ' ')"; fi
      # `|| exit 1`, not `&& echo`. Under `set -e` the left side of an `&&` is
      # exempt from the abort, and a `for` loop exits with the status of its
      # LAST iteration -- so the old form printed the syntax error and passed,
      # and only the final line of the step was ever enforced.
      - name: Parse the shell
        run: |
          for f in bin/preen install.sh site/sync-assets.sh; do
            bash -n "$f" || exit 1
            echo "ok  $f"
          done
          sh -n scripts/verify-site.sh || exit 1
          echo "ok  scripts/verify-site.sh"
      - name: Help output runs
        run: bin/preen --help > /dev/null && echo "ok  preen --help"
      - name: Installer dry run changes nothing
        run: ./install.sh --dry-run > /dev/null && echo "ok  install.sh --dry-run"
      # The behaviour suite. Parsing the shell says nothing about what the tool
      # does; this drives preen against throwaway repositories and checks the
      # file lists, the previews, the stdin sniff, and that the review modes
      # write nothing.
      - name: Install the tools the suite drives (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-delta fzf
      - name: Install the tools the suite drives (macOS)
        if: runner.os == 'macOS'
        # No `brew update`: the runner image is already current, and updating
        # costs minutes for nothing. git-delta is the formula; the binary it
        # installs is `delta`, which is the name the tests look for.
        run: brew install git-delta fzf
      - name: Test suite
        run: |
          echo "running the suite under: $(command -v bash) $(bash --version | head -n 1)"
          tests/run.sh

  # The build is the real check on the site: it fails on a duplicate slug, a
  # missing frontmatter title or a broken component, and it prerenders every
  # route so a page that would 404 in production fails here instead.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # `defaults.run.working-directory` above applies to `run:` steps
          # only, not to an action's inputs — without this the action looks for
          # packageManager in a package.json at the repo root, which does not
          # exist, and fails with "No pnpm version is specified".
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          # Matches site/Dockerfile, so CI and the deployed image agree.
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # `pnpm build` alone is not enough, and neither is the HTTP probe. A
      # broken client bundle still answers 200 with the prerendered markup in
      # the document; it throws in the browser, the element never upgrades, and
      # the page paints nothing. Only a real browser sees that.
      #
      # Two runs, not one, and the order matters. `dev` drives `litro dev`,
      # Vite serving modules from source. `preview` drives `litro preview`, the
      # prerendered dist/static that nginx ships -- the artifact production
      # actually serves, which nothing browser-level opened before this.
      #
      # What only `preview` can catch is client code that differs between the
      # two builds: anything behind `import.meta.env.PROD`, anything the
      # minifier or tree-shaker rewrites. A `throw` inside `if
      # (import.meta.env.PROD)` passes `dev` 5/5 and fails `preview` 3/5.
      #
      # They cannot share a run: `litro dev` deletes dist/ on startup, which is
      # the directory `litro preview` serves, and Playwright starts the entries
      # of a `webServer` array concurrently. So `dev` first, then `preview`,
      # which rebuilds dist/ as the first half of its own server command.
      - name: End-to-end (dev server)
        run: pnpm test:e2e:dev
      - name: End-to-end (built output)
        # `!cancelled()`, so a dev-server failure does not skip this. Without
        # it a branch that breaks both renderers needs two CI round trips to
        # learn that, and the built output -- the thing that actually ships --
        # is the half you would not hear about.
        if: '!cancelled()'
        run: pnpm test:e2e:preview
      - name: Playwright report
        # This job gates smoke-image, which gates deploy, so a failure here
        # blocks a release -- and without this the trace and HTML report that
        # explain why are thrown away with the runner. Each target reports into
        # its own subdirectory, so the passing run does not overwrite the
        # failing one.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
      # No rebuild step here. The `preview` run above ends with a fresh dist/,
      # because building it is the first half of that target's server command
      # -- and the route check below reads dist/static, so it fails loudly if
      # that ever stops being true.
      - name: Every documented route was prerendered
        run: |
          for p in "" docs/getting-started docs/browsing docs/pipes \
                   docs/pull-requests docs/worktrees docs/git-integration \
                   docs/theming; do
            f="dist/static/${p:+$p/}index.html"
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok  /$p"
          done

  # Build the exact image Coolify deploys, run it, and probe it the same way
  # verify-prod probes production. Catches "the site builds" vs "the container
  # actually serves it" — two different claims.
  smoke-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: [site]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          load: true
          tags: preen-docs:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --rm -p 8080:80 --name preen-docs-smoke preen-docs:ci
      - name: Probe container
        env:
          # Asserts the image really baked GIT_SHA into /version.json, so the
          # production probe below can rely on that signal.
          PREEN_EXPECT_COMMIT: ${{ github.sha }}
          PREEN_PROBE_RETRIES: '15'
          PREEN_PROBE_DELAY: '2'
        run: sh scripts/verify-site.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs preen-docs-smoke || true
      - name: Stop container
        if: always()
        run: docker stop preen-docs-smoke || true

  # Deploy only when a push to main actually changed the site. A change to
  # bin/preen or the installer cannot alter what preening.dev serves, so it
  # should not spend a build.
  #
  # This job FAILS if COOLIFY_WEBHOOK_URL, COOLIFY_API_TOKEN or PROD_BASE_URL
  # is missing. That is deliberate -- a silent skip would leave the site
  # permanently undeployed with CI green -- but it means all three have to
  # exist before the first site change lands on main.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [shell, site, smoke-image]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Did this push touch the site?
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare against what main pointed at BEFORE this push, not HEAD~1.
          # A push carries every commit since the last one — a merge, or three
          # commits at once — and HEAD~1 sees only the last of them. A push
          # whose final commit happens to miss site/ would then skip the deploy
          # and report green, with the site changes sitting undeployed.
          #
          # github.event.before is all-zeroes for a new branch, and points at a
          # discarded commit after a force-push. Both mean "cannot tell", and
          # the safe answer to that is to deploy.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "no usable before-commit ($BEFORE) — deploying to be safe."
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- site/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site/ unchanged across this push — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "site/ changed across this push — deploying."
          fi
      - name: Trigger Coolify deploy
        if: steps.gate.outputs.changed == 'true'
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # Hard failure, not a skip. This step only runs on a push to main
          # that changed site/, and the secrets are configured — so an unset
          # one means somebody renamed or removed it, and silently passing
          # would leave the site permanently undeployed while CI stayed green.
          missing=""
          [ -n "$COOLIFY_WEBHOOK_URL" ] || missing="$missing COOLIFY_WEBHOOK_URL"
          [ -n "$COOLIFY_API_TOKEN" ]   || missing="$missing COOLIFY_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::not set:$missing. The site cannot deploy."
            exit 1
          fi
          # No -L. Following a redirect re-sends the Authorization header to
          # whatever host it points at, which would hand the token to a third
          # party. The webhook URL is expected to answer directly.
          curl -fSs -X POST \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "$COOLIFY_WEBHOOK_URL"

  # Probe the live site after a deploy. The webhook only QUEUES a build, so
  # this must wait for the new commit to actually be serving —
  # PREEN_EXPECT_COMMIT makes the probe retry until /version.json reports this
  # exact SHA. Without it the probe passes against the previous container and a
  # failed deploy looks green.
  verify-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.outputs.changed == 'true'
    needs: [deploy]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production
        env:
          PREEN_EXPECT_COMMIT: ${{ github.sha }}
          # Coolify builds the image before swapping the container, so allow a
          # cold, uncached build: 60 x 10s = 10 minutes.
          PREEN_PROBE_RETRIES: '60'
          PREEN_PROBE_DELAY: '10'
        run: |
          if [ -z "${{ vars.PROD_BASE_URL }}" ]; then
            echo "::error::PROD_BASE_URL is not set, so the deploy cannot be verified."
            exit 1
          fi
          sh scripts/verify-site.sh "${{ vars.PROD_BASE_URL }}"
