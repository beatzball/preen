# A commit SHA does not move. That is the point of pinning ci.yml to them, and
# it is also the cost: with nothing watching, this repo runs whatever checkout
# was current the day it was pinned, forever, including its CVEs. Dependabot
# rewrites the SHA and the trailing `# v4.4.0` comment together, so the pin
# stays readable as well as current.
#
# `directory: /` is the whole of what github-actions means: Dependabot reads
# .github/workflows/ regardless of the path given here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly, not weekly. Six first-party GitHub and Docker actions on a
      # repo this size do not release often enough to be worth a weekly round,
      # and a stale pin is a slow problem rather than an urgent one.
      interval: monthly
    groups:
      # One pull request for the lot, not six. Every bump is the same
      # mechanical line change, and each separate one otherwise spends a full
      # CI run -- two shell legs, a Playwright suite and a Docker build -- to
      # merge a forty-character edit.
      actions:
        patterns:
          - "*"
# Expect the first round to be large. The pins freeze what the floating major
# tags were already serving, and those majors have moved on: checkout,
# setup-node and upload-artifact are on v7, build-push-action on v7, buildx on
# v4, pnpm/action-setup on v6. So the first grouped pull request carries six
# MAJOR bumps, not six patches. Read it as six upgrades that happen to arrive
# together, and check each new SHA the way the originals were checked -- the
# major ref, then `git/tags/<sha>` where the ref points at a tag object rather
# than a commit, which is the step that looks identical to success when it is
# skipped.
